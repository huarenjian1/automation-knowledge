name: Build Quartz Site

on:
  push:
    branches:
      - v5
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pull content from WebDAV
        env:
          WEBDAV_USER: ${{ secrets.WEBDAV_USER }}
          WEBDAV_PASS: ${{ secrets.WEBDAV_PASS }}
        run: |
          sudo apt-get install -y lftp
          rm -rf content
          lftp -c "open -u '$WEBDAV_USER','$WEBDAV_PASS' https://pan.ustc.edu.cn/seafdav/; mirror --verbose vault-hrj/01自动化知识网络图谱 ./content --target-directory=."
          # 如果上面不行，尝试把子目录内容提上来
          if [ -d "content/01自动化知识网络图谱" ]; then
            mv content/01自动化知识网络图谱/* content/
            rm -rf content/01自动化知识网络图谱
          fi
          echo "=== files ==="
          find content -name "*.md" | head -20
          echo "=== count ==="
          find content -name "*.md" | wc -l

      - run: npm ci
      - run: npx quartz build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
